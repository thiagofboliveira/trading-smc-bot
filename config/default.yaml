data:
  root: data
  server_ny_offset_hours: 7
  server_timezone: null
symbols: [XAUUSD, EURUSD, GBPUSD, US30, NAS100, BRENT]
dukascopy:
  offer_side: bid
  instruments:
    XAUUSD: "XAU/USD"
    EURUSD: "EUR/USD"
    GBPUSD: "GBP/USD"
    US30: "E_D&J-Ind"
    NAS100: "E_NQ-100"
    BRENT: "E_Brent"
    DAX40: "E_DAAX"
    USDJPY: "USD/JPY"
structure:
  pivot_k_htf: 3
  pivot_k_ltf: 2
zones:
  require_discount: true
  require_imbalance: false
  use_body: false
  fvg_min_size: 0.0
  blocks_filter: [OB, FVOB, BB]
  breaker_require_imbalance: true
  breaker_require_choch: false
  breaker_max_age: 96
backtest:
  entry_mode: confirmation
  stop_mode: ob
  target_mode: fixed_r
  target_r: 3.0
  max_open_per_symbol: 1
  confirmation_timeout_minutes: null
  costs:
    spread_pips:
      XAUUSD: 0.20
      EURUSD: 0.00008
      GBPUSD: 0.00010
      US30: 2.0
      NAS100: 1.5
      BRENT: 0.03
    commission_per_lot: 0.0
    slippage_points: 0.0
  session:
    windows:
      - name: london
        start: "07:00"
        end: "15:30"
      - name: ny
        start: "13:00"
        end: "20:00"
    force_close_time: "21:00"
  limits:
    enabled: false
    max_trades_per_day: 3
    max_stops_per_day: 2
    max_gains_per_day: 1
  confluence:
    use_ema80: false
    use_sma200: false
    use_fib618: false
    use_fib790: false
    ma_timeframe: M1
    tolerance: 0.0
    min_rules: 1
  trailing:
    mode: none
    ema_period: 20
    timeframe: M1
    activation: either
    r_threshold: 1.0

# Especificação e custos por ativo (D-05). Fonte única do spread usado pelo fibo-backtest.
# Spread = valor típico em preço, SUPOSIÇÃO a validar contra o spread real (M-07), não medição.
contracts:
  XAUUSD: {spread: 0.30}
  NAS100: {spread: 1.50}
  US30:   {spread: 2.00}
  DAX40:  {spread: 1.50}
  BRENT:  {spread: 0.04}
  EURUSD: {spread: 0.00015}
  GBPUSD: {spread: 0.00020}
  USDJPY: {spread: 0.018}
  WIN:
    spread: 5.0            # 1 tick
    tick_size: 5.0
    point_value: 0.2       # R$ por ponto, por contrato
    note: "valores de tick/ponto de memória: confirmar com a corretora; somar corretagem e emolumentos"
  WDO:
    spread: 0.5            # 1 tick
    tick_size: 0.5
    point_value: 10.0
    note: "valores de tick/ponto de memória: confirmar com a corretora; somar corretagem e emolumentos"
