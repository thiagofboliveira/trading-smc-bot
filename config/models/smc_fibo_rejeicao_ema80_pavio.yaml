# ===================================================================
# SMC TRADER — MODELO: SMC FIBO REJEIÇÃO EMA80 PAVIO (SELETIVO)
# ===================================================================
# Nomenclatura Padrão: <estrategia>_<conceito> (M-03)
# ===================================================================
# Conceito: Zona de retração [50% a 79%] com toque na EMA 80 no M5,
# exigindo fechamento da barra de gatilho a favor da EMA 80 e acima/abaixo
# de 79%, com pavio de rejeição >= 50% do range da barra.
# Execução e Condução: Entrada causal a mercado na abertura da barra seguinte (i + 1),
# stop inicial em 88,6% da perna, trava de +1,0R ao atingir +1,618R e alvo em 4,0R.
# Status: Resultado preliminar, NÃO validado fora da amostra (em backtest Dukascopy
# M1 -> M5 com spreads de config/default.yaml: dentro da amostra 01/03/2026 a 16/10/2026
# deu +48,8R em 160 trades, WR 46,2%, +0,305R ± 0,134R/tr; porém fora da amostra
# 16/10/2024 a 01/03/2026 deu -34,3R em 335 trades, WR 33,7%, -0,102R ± 0,079R/tr;
# consolidado 2 anos: +14,6R em 495 trades, +0,029R ± 0,070R/tr).
# ===================================================================

model:
  id: "smc_fibo_rejeicao_ema80_pavio"
  name: "SMC-Fibo-Rejeicao-EMA80-Pavio"
  version: "1.2.0"
  description: "Zona Fibo [50%-79%] com toque/rejeição na EMA 80 (pavio >= 50%), trava +1R em 1.618R e alvo 4.0R (não validado no OOS 2024-2026)"

timeframes:
  operational: "M5"

fibonacci:
  entry_level: 0.500            # Início da zona de retração (50.0%)
  rejection_max_level: 0.790    # Limite máximo da zona para o fechamento de rejeição (79.0%)
  stop_level: 0.886             # Nível de invalidação da perna (88.6%)
  origin_level: 1.000
  entry_mode: "m5_close_rejection"
  stop_mode: "fibo"
  rejection_min_wick_ratio: 0.50
  target_mode: "3R"
  target_r: 4.0
  pivot_k: 2
  max_holding_candles: 60
  enable_reentry_79: false

filters:
  trend_ma: "ema80"
  confluence_ma: "ema80"

trailing:
  mode: "none"
  bos_swing_trailing: false
  profit_lock:
    trigger_r: 1.618
    lock_r: 1.0
  ma_type: null

risk_management:
  risk_pct_per_trade: 1.0
  max_open_trades_total: 4
  max_trades_per_day: 5
  max_stops_per_day: 2

session:
  session_filter: true
  session_windows:
    - ["07:00", "18:00"]
