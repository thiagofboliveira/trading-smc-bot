# ===================================================================
# SMC TRADER — CONFIGURAÇÃO OFICIAL DE PRODUÇÃO (LIVE / PAPER MT5)
# Validado via Pydantic com restrição estrita extra='forbid'
# Modelos canônicos: smc_fibo_estrutural, smc_fibo_trailing, smc_fibo_blindado
# ===================================================================

trading:
  risk_pct_per_trade: 1.0       # 1.0% de risco do equity por operação
  max_open_trades_total: 4      # Máximo de 4 operações abertas simultaneamente na carteira
  magic_base: 888300

bridge:
  host: "127.0.0.1"
  port: 8089
  poll_interval_ms: 500
  auth_token: null

kill_switch:
  max_daily_loss_pct: 3.0       # Perda diária máxima de 3.0% do equity -> emergency stop
  max_consecutive_losses: 3     # Pausa operações após 3 stops consecutivos no dia
  max_spread_multiplier: 2.5    # Bloqueia novas entradas se spread > 2.5x o spread típico
  max_data_delay_seconds: 180   # Bloqueia ordens se último candle for mais velho que 3 min

models:
  # Modelo 1: Fibo Trailing Stop por MME8 (REPROVADO NA AUDITORIA: -483R)
  smc_fibo_trailing:
    name: "SMC-Fibo-Trailing"
    strategy: "fibo_ote"
    timeframe: "M5"
    fibo_entry: 0.705
    fibo_stop: 0.790
    target_mode: "0_percent"
    target_r: 3.0
    pivot_k: 3
    trailing_exit_ma: "ema8"
    status: "reproved"

  # Modelo 2: Fibo Blindado (REPROVADO NA AUDITORIA: -478R)
  smc_fibo_blindado:
    name: "SMC-Fibo-Blindado"
    strategy: "fibo_ote"
    timeframe: "M5"
    fibo_entry: 0.705
    fibo_stop: 0.790
    target_mode: "0_percent"
    target_r: 3.0
    pivot_k: 3
    trailing_exit_ma: "ema8"
    status: "reproved"
    profit_lock:
      trigger_r: 2.0
      lock_r: 1.0

  # Modelo 3: Fibo Estrutural Clássico (REPROVADO NA AUDITORIA: -270R)
  smc_fibo_estrutural:
    name: "SMC-Fibo-Estrutural"
    strategy: "fibo_ote"
    timeframe: "M5"
    fibo_entry: 0.705
    fibo_stop: 1.000
    target_mode: "0_percent"
    target_r: 3.0
    pivot_k: 3
    trailing_exit_ma: "ema8"
    status: "reproved"

  # Modelo 4: Fibo Ouro Sessão Londres/NY (+9.9R auditado, PF 1.05, WR 40.1%)
  smc_fibo_gold_session:
    name: "SMC-Fibo-Gold-Session"
    strategy: "fibo_ote"
    timeframe: "M5"
    fibo_entry: 0.618
    fibo_stop: 1.000
    target_mode: "0_percent"
    target_r: 3.0
    pivot_k: 2
    trailing_exit_ma: null
    session_filter: true
    session_windows: [["07:00", "18:00"]]
    status: "approved"

# ===================================================================
# SÍMBOLOS: Todos desativados por padrão (fail-closed contra risco real).
# Apenas ative 'enabled: true' conscientemente após validação em paper trading.
# ===================================================================
symbols:
  XAUUSD:
    model: "smc_fibo_gold_session"
    description: "Ouro — SMC-Fibo-Gold Sessão Londres/NY M5"
    macro_tf: "M5"
    order_type: "limit"
    enabled: false

  NAS100:
