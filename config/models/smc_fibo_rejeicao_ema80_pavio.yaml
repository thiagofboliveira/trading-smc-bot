# ===================================================================
# SMC TRADER — MODELO: SMC FIBO REJEIÇÃO EMA80 PAVIO (SELETIVO)
# ===================================================================
# Nomenclatura Padrão: <estrategia>_<conceito> (M-03)
# ===================================================================
# Conceito: Zona OTE Estrita [61.8% a 79.0%] com toque na EMA 80 no M5,
# exigindo FVG (Fair Value Gap / Imbalance) na perna impulsiva do BOS,
# Inducement prévio (formado antes da zona de 61.8% com repique >= 10%),
# fechamento da barra de gatilho a favor da EMA 80 e acima/abaixo de 79%,
# com pavio de rejeição >= 50% do range da barra, operando nas ICT Killzones.
# Execução e Condução: Entrada causal a mercado na abertura da barra seguinte (i + 1),
# stop inicial em 88,6% da perna, trava de +1,0R ao atingir +1,618R e alvo em 3,0R.
# Status Auditado (2 anos Dukascopy M1 -> M5, 2024-11 a 2026-11):
# Cesta Positiva (BRENT, NAS100, XAUUSD): +39,81R em 101 trades (+0,394R/trade),
# Ano 1 (2024/25): +19,88R | Ano 2 (2025/26): +19,93R | WR 54,5% | PF 1,87 | MaxDD 6,0R.
# Ativos individuais (2 anos): BRENT +20,00R | XAUUSD +10,39R | NAS100 +9,42R | DAX40 +7,01R | EURUSD +2,00R.
# Portfólio Global (7 Ativos): +24,82R em 237 trades (Ano 1: +3,88R | Ano 2: +20,95R | PF 1,18 | MaxDD 14,0R).
# ===================================================================

model:
  id: "smc_fibo_rejeicao_ema80_pavio"
  name: "SMC-Fibo-Rejeicao-EMA80-Pavio"
  version: "1.4.0"
  description: "Zona OTE [61.8%-79%] com FVG no BOS + Inducement prévio + toque/rejeição na EMA 80 (pavio >= 50%), ICT Killzones, trava +1R em 1.618R e alvo 3.0R"

timeframes:
  operational: "M5"

fibonacci:
  entry_level: 0.618            # Início da zona OTE de retração (61.8% Golden Ratio)
  rejection_max_level: 0.790    # Limite máximo da zona para o fechamento de rejeição (79.0%)
  stop_level: 0.886             # Nível de invalidação da perna (88.6%)
  origin_level: 1.000
  entry_mode: "m5_close_rejection"
  stop_mode: "fibo"
  rejection_min_wick_ratio: 0.50
  target_mode: "3R"
  target_r: 3.0
  pivot_k: 2
  max_holding_candles: 60
  enable_reentry_79: false
  require_inducement: true
  require_leg_fvg: true

filters:
  trend_ma: "ema80"
  confluence_ma: "ema80"

trailing:
  mode: "none"
  bos_swing_trailing: false
  profit_lock:
    trigger_r: 1.618
    lock_r: 1.0
  ma_type: null

risk_management:
  risk_pct_per_trade: 1.0
  max_open_trades_total: 4
  max_trades_per_day: 3
  max_stops_per_day: 2
  max_gains_per_day: 1

session:
  session_filter: true
  session_windows:
    - ["07:00", "10:30"]
    - ["12:30", "16:30"]
