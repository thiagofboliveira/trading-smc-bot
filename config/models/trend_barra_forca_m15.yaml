# ===================================================================
# SMC TRADER — MODELO: TREND BARRA DE FORÇA M15 (PONTO CONTÍNUO / IGNIÇÃO)
# ===================================================================
# Nomenclatura Padrão: <estrategia>_<conceito> (M-03)
# ===================================================================
# Conceito: Seguidor de Super Tendência intraday no M15 durante a Sessão de Nova York
# (13:00 às 17:30 UTC). Filtro macro causal: MME 80 e MME 200 alinhadas em i-1,
# ADX(14) >= 25 em i-1 e inclinação normalizada da MME 80 por ATR(14) entre 0.10 e 1.00.
# Gatilho: Barra de Força / Ignição (pullback tocando a MME 8 ou MME 20 e fechando nos
# 30% extremos da barra com amplitude direcional e acima/abaixo da MME 8).
# Execução: BuyStop/SellStop causal na barra i+1 na superação da barra de sinal.
# Condução: Saída causal por fechamento além da MME 20 executada no Open da barra seguinte.
#
# Métricas 5 Anos Corrigidas (2021-11-01 a 2026-11-08) com spread real e stop intrabar:
# Com Slippage Realista (1.0 pt nas ordens stop):
# Total Carteira: +63.3R em 376 trades (+0.168 ± 0.120R/trade, WR 30.6%, PF 1.26, MaxDD 31.4R)
# In-Sample (3 anos): +33.6R | Out-of-Sample (2 anos): +29.7R
# Detalhamento: NAS100 +43.9R (WR 31.8%, PF 1.35) | US30 +19.4R (WR 29.2%, PF 1.17)
# Sem Slippage Adicional: +80.3R em 376 trades (WR 30.9%, PF 1.34)
# ===================================================================

model:
  id: "trend_barra_forca_m15"
  name: "Trend-Barra-Forca-M15"
  version: "1.1.0"
  description: "Super Tendência no M15 com Barra de Força corrigido anti-viés"

timeframes:
  operational: "M15"

strategy:
  type: "trend_follower"
  execution_mode: "single_position"
  triggers:
    - "force_bar"
  slippage_pts: 1.0

filters:
  session:
    use_filter: true
    start_utc: "13:00"
    end_utc: "17:30"
  macro:
    adx_period: 14
    adx_min: 25.0
    ema_fast: 80
    ema_slow: 200
    slope_min: 0.10
    slope_max: 1.00

conduction:
  ma_type: "mme20"
  exit_on_next_open: true
  profit_lock: false

limits:
  max_trades_per_day: 3
  max_stops_per_day: 2
  max_gains_per_day: 1
