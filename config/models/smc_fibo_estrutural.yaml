# ===================================================================
# SMC TRADER — MODELO CONCEITUAL: SMC FIBO ESTRUTURAL
# ===================================================================
# Nomenclatura Padrão: <estrategia>_<conceito> (sem métricas embutidas no nome - M-03)
# ===================================================================
# Conceito: Entrada 61.8% com Stop Estrutural SMC (100% - Fundo/Topo do BOS)
# Condução: Trailing Stop dinâmico na MME 8 (apenas no lucro)
# Status de Validação: Recalibrado após remoção de vieses F-01 a F-10.
# Nota de Risco: Sob simulação estrita anti-viés, a versão padrão M5 apresentou
# expectativa negativa nos dados Dukascopy 2026. Necessita reotimização via walk-forward.
# ===================================================================

model:
  id: "smc_fibo_estrutural"
  name: "SMC-Fibo-Estrutural"
  version: "3.0.0"
  description: "Modelo Fibo SMC com Stop Estrutural 100% e Condução MME 8"

timeframes:
  operational: "M5"

fibonacci:
  entry_level: 0.618            # Golden Ratio institucional (61.8%)
  stop_level: 1.000             # Invalidação Estrutural Real do SMC (Fundo/Topo do BOS)
  origin_level: 1.000
  target_mode: "0_percent"      # Alvo estrutural máximo no topo/fundo
  pivot_k: 2                    # Confirmação fractal sem lookahead
  max_holding_candles: 60
  enable_reentry_79: false

trailing:
  mode: "moving_average"
  ma_type: "ema8"               # MME 8
  exit_on_close_cross: true
  profit_only: true             # Encerra por trailing apenas se estiver no lucro

risk_management:
  risk_pct_per_trade: 1.0
  max_open_trades_total: 4
  max_trades_per_day: 5
  max_stops_per_day: 2

session:
  mode: "24h"
  force_close_time: "21:30"
