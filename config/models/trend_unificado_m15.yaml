# ===================================================================
# SMC TRADER — MODELO: TREND UNIFICADO M15 (MULTI-GATILHO SINGLE-POSITION)
# ===================================================================
# Nomenclatura Padrão: <estrategia>_<conceito> (M-03)
# ===================================================================
# Conceito: Seguidor de Super Tendência intraday no M15 durante a Sessão de Nova York
# (13:00 às 17:30 UTC). Opera em modo single-position (máximo 1 trade ativo por vez,
# sem contagem dupla) com 3 gatilhos priorizados: Trap > Force Bar > Engulfing.
# Condução: Saída causal por fechamento além da MME 20 executada no Open da barra seguinte.
#
# AUDITORIA ANTI-VIÉS (2026-11-08 — AGENTS.md Caso Real):
# O valor originalmente relatado (+281.0R / 741 trades) continha falhas de simulação:
# 1. Omissão de stop na barra de entrada (-40R);
# 2. Gaps de stop preenchidos no nível exato em vez do Open (-1.9R);
# 3. Contagem dupla no modo independente (360 trades duplicados em 167 candles);
# 4. Falta de slippage em ordens stop.
#
# MÉTRICAS CORRIGIDAS DO MODELO CONFIGURADO (5 Anos: 2021-11-01 a 2026-11-08, spreads reais: NAS100 1.5, US30 2.0):
# Modo Single-Position com Slippage Realista (1.0 pt nas ordens stop):
# Total Carteira: +54.7R em 457 trades (Expectativa: +0.120 ± 0.112R/trade, WR 28.9%, PF 1.18, MaxDD 29.9R)
# Estatística t = 1.07 (NÃO DISTINGUÍVEL DE ZERO, t < 2.0).
# In-Sample (3 anos: 2021-2024): +8.5R (PF 1.05 — estatisticamente nulo)
# Out-of-Sample (2 anos: 2024-2026): +46.2R (PF 1.38)
# Anos Negativos: 2023 (-16.9R) e 2025 (-11.1R)
# NAS100: +39.9R (236 trades, WR 30.9%, PF 1.26) | US30: +14.7R (221 trades, WR 26.7%, PF 1.10)
#
# Modo Independente (Loops Separados com até 3R de risco simultâneo):
# Total Carteira: +142.4R em 764 trades (+0.186 ± 0.087R/trade, PF 1.29) — decorrente de tripla exposição ao regime.
#
# Sem Slippage Adicional (apenas spread):
# Total Carteira: +76.2R em 457 trades (+0.167 ± 0.115R/trade, WR 29.1%, PF 1.25, MaxDD 26.2R)
#
# FONTE DE VANTAGEM (BASELINE DE CONTROLE):
# Entrada aleatória no mesmo regime macro (MME 80/200, ADX >= 25, NY 13-17:30 UTC, saída MME 20):
# Rende entre -21.4R e +86.7R dependendo da semente. Os gatilhos gráficos não geram
# alpha estatisticamente significativo além do regime de momentum do índice.
# Fora de índices de ações americanos (Forex/Commodities), o modelo produz perdas (-33R a -63R).
# ===================================================================

model:
  id: "trend_unificado_m15"
  name: "Trend-Unificado-M15"
  version: "1.1.0"
  description: "Super Tendência no M15 multi-gatilho single-position corrigido anti-viés"

timeframes:
  operational: "M15"

strategy:
  type: "trend_follower"
  execution_mode: "single_position"
  triggers:
    - "trap"
    - "force_bar"
    - "engulfing"
  slippage_pts: 1.0

filters:
  session:
    use_filter: true
    start_utc: "13:00"
    end_utc: "17:30"
  macro:
    adx_period: 14
    adx_min: 25.0
    ema_fast: 80
    ema_slow: 200
    slope_min: 0.10
    slope_max: 1.00

conduction:
  ma_type: "mme20"
  exit_on_next_open: true
  profit_lock: false

limits:
  max_trades_per_day: 3
  max_stops_per_day: 2
  max_gains_per_day: 1
