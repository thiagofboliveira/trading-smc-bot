[project]
name = "smc-trader"
version = "0.1.0"
description = "Assistente de day trade SMC: detectores em M15 e backtest"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy",
    "pyarrow",
    "pydantic>=2",
    "pyyaml",
    "plotly",
    "dukascopy-python",
    "openpyxl>=3.1.5",
    "matplotlib>=3.11.2",
]

[project.scripts]
smc = "smc_trader.cli:main"

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smc_trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
